name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ vars.DISPATCH_MODE }}
        run: |
          if [ "$EVENT" = push ]; then sleep 45; fi
          echo "event $EVENT, dispatch mode ${MODE:-range}, HEAD $(git rev-parse HEAD)"
          if [ "$EVENT" = push ] || { [ "$EVENT" != pull_request ] && [ "$MODE" = full ]; }; then
            code=true
          else
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "changed files:"; echo "$files"
            if echo "$files" | grep -qvE '^docs/|\.md$'; then code=true; else code=false; fi
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  heavy:
    name: Heavy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          sleep 5
          if [ "$GITHUB_EVENT_NAME" = push ]; then echo "::error::the push run fails"; exit 1; fi
          if [ -f lab/fail.txt ]; then echo "::error::lab/fail.txt exists"; exit 1; fi
          if [ -f lab/flaky.txt ] && [ "$ATTEMPT" = 1 ]; then echo "::error::lab/flaky.txt fails on attempt 1"; exit 1; fi
          echo "passed on attempt $ATTEMPT"

  all:
    name: All checks
    needs: [changes, heavy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [ -n "$bad" ]; then echo "::error::not passed: $bad"; exit 1; fi
