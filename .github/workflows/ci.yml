name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "changed files:"; echo "$files"
            if echo "$files" | grep -qvE '^docs/|\.md$'; then code=true; else code=false; fi
          else
            tree=$(git rev-parse 'HEAD^{tree}')
            head=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].head.sha // empty')
            tested=""
            if [ -n "$head" ]; then
              for run in $(gh api "repos/$REPO/actions/runs?event=pull_request&head_sha=$head&status=success" --jq '.workflow_runs[].id'); do
                job=$(gh api "repos/$REPO/actions/runs/$run/jobs" --jq '.jobs[] | select(.name == "Heavy" and .conclusion == "success") | .id')
                [ -n "$job" ] || continue
                tested=$(gh api --allow-escape-sequences "repos/$REPO/actions/jobs/$job/logs" | sed -n 's/.*TESTED_TREE=\([0-9a-f]\{40\}\).*/\1/p' | head -n 1)
                [ -n "$tested" ] && break
              done
            fi
            echo "main tree $tree, pull request head ${head:-none}, tested tree ${tested:-none}"
            if [ "$tested" = "$tree" ]; then code=false; else code=true; fi
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  heavy:
    name: Heavy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: |
          if [ -f lab/slow.txt ]; then sleep 90; fi
          sleep 5
          if [ -f lab/fail.txt ]; then echo "::error::lab/fail.txt exists"; exit 1; fi
          echo "TESTED_TREE=$(git rev-parse 'HEAD^{tree}')"

  all:
    name: All checks
    needs: [changes, heavy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [ -n "$bad" ]; then echo "::error::not passed: $bad"; exit 1; fi
