name: PR text

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: text-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messages:
    name: Messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$TITLE" in *BAD*) echo "::error::the title contains BAD"; exit 1 ;; esac
          echo "title ok: $TITLE"
