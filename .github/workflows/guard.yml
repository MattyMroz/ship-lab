name: Guard

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Workflow guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "GITHUB_SHA $GITHUB_SHA, pull request $NUMBER head $HEAD_SHA"
          changed=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[] | select((.filename | startswith(".github/workflows/")) or ((.previous_filename // "") | startswith(".github/workflows/"))) | "\(.status) \(.filename)"')
          if [ -n "$changed" ]; then
            echo "::error::the pull request changes workflow files"
            echo "$changed"
            exit 1
          fi
          echo "no workflow file changed"
