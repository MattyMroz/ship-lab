name: Fake

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  wait:
    name: Wait
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: sleep 60

  all:
    name: All checks
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "fake green"
